services:
  - type: web
    name: burak-review
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python frontend/server.py
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: 3.13.0
    healthCheckPath: /api/products
    autoDeploy: true
