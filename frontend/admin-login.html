<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">

    <title>BURAK REVIEW — Admin Giriş</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f6f9;
            color: #1a1d23;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
            font-weight: 900;
            color: #1a1d23;
        }

        p {
            margin: 0 0 28px;
            color: #6b7280;
            font-size: 15px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-size: 13px;
            font-weight: 700;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(0, 0, 0, 0.10);
            border-radius: 10px;
            background: #f4f6f9;
            color: #1a1d23;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
            background: #fff;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
        }

        button:disabled {
            opacity: .5;
            cursor: wait;
            transform: none;
            box-shadow: none;
        }

        #message {
            min-height: 22px;
            margin-top: 16px;
            color: #dc2626;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <main class="login-box">

        <h1>🔐 BURAK REVIEW</h1>

        <p>Yönetici paneline giriş yap</p>

        <form id="loginForm">

            <label for="username">
                Kullanıcı adı
            </label>

            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
            >

            <label for="password">
                Şifre
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button id="loginButton" type="submit">
                🔓 Giriş Yap
            </button>

            <div id="message"></div>

        </form>

    </main>

    <script src="admin-login.js"></script>

</body>
</html>
